protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
auth_verbose = no
auth_debug = no
auth_debug_passwords = no
log_path = /dev/stderr
info_log_path = /dev/stdout
mail_location = maildir:~/Maildir
first_valid_uid = 5000
mail_uid = 5000
mail_gid = 5000
passdb {
  driver = passwd-file
  args = /run/bitigmail-users
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/mail/%u
}
namespace inbox {
  inbox = yes
  separator = /
  prefix =
}
service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}
